<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="75%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1E3A8A" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#0B132B" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050814"/>
    </radialGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGlow)"/>

  <!-- Subtle Grid lines -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Brand Mark -->
  <g transform="translate(100, 100)">
    <rect width="72" height="72" rx="20" fill="url(#logoGrad)"/>
    <path d="M21 51V21L51 51V21" fill="none" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="21" cy="21" r="3.5" fill="#22D3EE"/>
    <circle cx="51" cy="51" r="3.5" fill="#22D3EE"/>
    <text x="96" y="52" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">NayaaSoft</text>
  </g>

  <!-- Tagline Pill -->
  <g transform="translate(100, 210)">
    <rect width="360" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
    <circle cx="24" cy="21" r="5" fill="#10B981"/>
    <text x="42" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#22D3EE">HIGH-PERFORMANCE SOFTWARE AGENCY</text>
  </g>

  <!-- Headline -->
  <text x="100" y="320" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="58" font-weight="800" fill="url(#textGrad)">
    Web &amp; Mobile App
  </text>
  <text x="100" y="388" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="58" font-weight="800" fill="#FFFFFF">
    Development Agency
  </text>

  <!-- Subtitle -->
  <text x="100" y="455" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" fill="#94A3B8">
    Flutter iOS &amp; Android • Next.js &amp; React • Scalable Cloud Backends
  </text>

  <!-- Bottom Badges / URL -->
  <g transform="translate(100, 520)">
    <text x="0" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#38BDF8">🌐 www.nayaasoft.com</text>
    <text x="380" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" fill="#64748B">•</text>
    <text x="410" y="26" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="600" fill="#94A3B8">Your Ideas. Our Code. Better Tomorrow.</text>
  </g>
</svg>
